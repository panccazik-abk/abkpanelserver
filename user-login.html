<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SYSTEM ACCESS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #e2e8f0;
    font-family: -apple-system, sans-serif;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    background: #1a1a1a; border: 2px solid #f59e0b;
    border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 360px; text-align: center;
  }
  .lock { font-size: 56px; margin-bottom: 12px; }
  h1 { color: #f59e0b; font-size: 22px; letter-spacing: 2px; margin-bottom: 4px; font-weight: 800; }
  .subtitle { color: #94a3b8; font-size: 11px; margin-bottom: 24px; letter-spacing: 1px; }
  input {
    width: 100%; padding: 14px; margin-bottom: 12px;
    background: #0a0a0a; border: 1px solid #1f2937;
    border-radius: 10px; color: #e2e8f0; font-size: 14px; outline: none;
  }
  input:focus { border-color: #f59e0b; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; margin-bottom: 8px;
  }
  .btn-login { background: #f59e0b; color: #000; }
  .btn-copy { background: #ef4444; color: #fff; }
  .btn-admin { background: #374151; color: #fff; }
  #error { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 18px; }
  .hwid { color: #f59e0b; font-size: 10px; margin-top: 16px; word-break: break-all; }
  .popup-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); align-items: center;
    justify-content: center; z-index: 999;
  }
  .popup-overlay.show { display: flex; }
  .popup {
    background: #1a1a1a; border: 2px solid #f59e0b;
    border-radius: 16px; padding: 28px 24px;
    max-width: 340px; width: 90%; text-align: center;
  }
  .popup-icon { font-size: 56px; margin-bottom: 12px; }
  .popup-title { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 12px; letter-spacing: 1px; }
  .popup-msg { color: #94a3b8; font-size: 13px; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
  .popup-btn { width: 100%; padding: 12px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>

<div class="box">
  <div class="lock">🔒</div>
  <h1>SYSTEM ACCESS</h1>
  <div class="subtitle">Authorized Personnel Only</div>

  <input type="text" id="username" placeholder="Username" autocomplete="off">
  <input type="password" id="password" placeholder="Password" autocomplete="off">
  <button class="btn-login" onclick="doLogin()" id="btnLogin">LOGIN</button>
  <button class="btn-copy" onclick="copyHwid()">COPY ID</button>
  <button class="btn-admin" onclick="openAdmin()">ADMIN</button>

  <div id="error"></div>
  <div class="hwid" id="hwidDisplay">ID: -</div>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup">
    <div class="popup-icon" id="popupIcon">⚠️</div>
    <div class="popup-title" id="popupTitle">MAINTENANCE</div>
    <div class="popup-msg" id="popupMsg">-</div>
    <button class="popup-btn" onclick="closePopup()">TUTUP</button>
  </div>
</div>

<script>
  // ===== URL VERCEL BARU =====
  const API_URL = "https://abkpanelserver.vercel.app/api/validate";
  const ADMIN_URL = "https://abkpanelserver.vercel.app";

  function getHwid() {
    let hwid = localStorage.getItem("abk_hwid");
    if (!hwid) {
      hwid = "DEV-" + Math.random().toString(36).slice(2, 10).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
      localStorage.setItem("abk_hwid", hwid);
    }
    return hwid;
  }

  function copyHwid() {
    const hwid = getHwid();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(hwid).then(() => alert("✅ ID dicopy:\n" + hwid));
    } else {
      const input = document.createElement("input");
      input.value = hwid;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      alert("✅ ID dicopy:\n" + hwid);
    }
  }

  function showPopup(title, msg, icon) {
    document.getElementById("popupIcon").textContent = icon || "⚠️";
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupMsg").textContent = msg;
    document.getElementById("popup").classList.add("show");
  }

  function closePopup() {
    document.getElementById("popup").classList.remove("show");
  }

  function openAdmin() {
    window.location.href = ADMIN_URL;
  }

  async function doLogin() {
    const errEl = document.getElementById("error");
    const btn = document.getElementById("btnLogin");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      errEl.textContent = "❌ Isi username & password";
      return;
    }

    btn.disabled = true;
    btn.textContent = "MEMPROSES...";
    errEl.textContent = "";

    try {
      const hwid = getHwid();
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, hwid })
      });
      const data = await res.json();

      if (data.maintenance) {
        showPopup("MAINTENANCE", data.message || "Server maintenance", "🔧");
        btn.disabled = false; btn.textContent = "LOGIN";
        return;
      }

      if (!data.valid) {
        showPopup("ACCESS DENIED", data.message || "Token tidak valid", "⚠️");
        btn.disabled = false; btn.textContent = "LOGIN";
        return;
      }

      localStorage.setItem("abk_token", JSON.stringify({
        username, password, hwid,
        expiry: data.user?.expiry,
        sisa_hari: data.user?.sisa_hari,
        login_time: Date.now()
      }));

      showPopup("✅ LOGIN BERHASIL",
        "User: " + data.user.username +
        "\nExpiry: " + data.user.expiry +
        "\nSisa: " + data.user.sisa_hari + " hari",
        "✅");

    } catch (e) {
      errEl.textContent = "❌ Gagal koneksi: " + e.message;
      btn.disabled = false; btn.textContent = "LOGIN";
    }
  }

  window.addEventListener("load", () => {
    document.getElementById("hwidDisplay").textContent = "ID: " + getHwid();
  });
</script>
</body>
</html>
